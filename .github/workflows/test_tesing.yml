name: Build and Test Liferay

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the branch
  push:
    branches: [ "workflow-github-actions" ]
  pull_request:
    branches: [ "workflow-github-actions" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANT_OPTS: "-Xmx2560m"

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
          architecture: x64
          
      - name: Build Liferay
        run: ant all
        
      - name: Run Tests
        run: |
          cd modules/apps/portal-search/portal-search-test
          gw test
